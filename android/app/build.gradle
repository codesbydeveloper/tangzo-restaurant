plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")

if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")

if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.tangzo.restaurant"

    compileSdk = 36
    ndkVersion = "29.0.14033849"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.tangzo.restaurant"
        minSdk = 24
        targetSdk = 36
        versionCode = 10
        versionName = flutterVersionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true


        // Ship only ARM ABIs.
        // This avoids non-16KB x86_64 native libraries.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }


    // ========================================================
    // SIGNING CONFIGURATION
    // ========================================================

    signingConfigs {

        release {
            keyAlias keystoreProperties['keyAlias']

            keyPassword keystoreProperties['keyPassword']

            storeFile keystoreProperties['storeFile'] ?
                    file(keystoreProperties['storeFile']) :
                    null

            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {

        release {
            minifyEnabled false
            shrinkResources false

            // IMPORTANT:
            // Restaurant release APK/AAB uses the production
            // Restaurant keystore instead of debug.keystore.
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // Required for Google Play 16 KB page-size compliance
            useLegacyPackaging = false
        }
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.core:core:1.13.1'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    // implementation 'io.card:android-sdk:5.5.1'
    // implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.0'
    // implementation 'com.google.android.gms:play-services-wallet:19.4.0'
    // implementation 'com.foloosi:FoloosiSDK:2.0.24'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}

flutter {
    source = "../.."
}